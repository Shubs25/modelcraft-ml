<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ML Model Benchmark</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 flex flex-col items-center">

  <div class="max-w-4xl w-full space-y-8">
    
    <!-- Title -->
    <header class="text-center space-y-2">
      <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400">
        ModelCraft-ML
      </h1>
      <p class="text-slate-400">
        Just like Minecraft, but with ML Models!
      </p>
    </header>

    <!-- Peek Training Data Section -->
    <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-slate-200">1. Training Data Preview</h2>
          <p class="text-sm text-slate-400">Inspect sample rows from the dataset.</p>
        </div>
        <button 
          id="peekBtn" 
          onclick="peekData()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition shadow"
        >
          Peek into the training data
        </button>
      </div>

      <!-- Preview Table Container -->
      <div id="dataPreview" class="hidden overflow-x-auto mt-4 border border-slate-700 rounded-lg max-h-60">
        <!-- Rendered dynamically by script.js -->
      </div>
    </section>

    <!-- CSV Upload & Predict Section -->
    <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg space-y-6">
      <div>
        <h2 class="text-xl font-semibold text-slate-200">2. Run Predictions</h2>
        <p class="text-sm text-slate-400">Upload your test CSV to evaluate all 5 models.</p>
      </div>

      <!-- CSV Upload Button -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2" for="csvFile">
          Upload Test Data (CSV)
        </label>
        <input 
          type="file" 
          id="csvFile" 
          accept=".csv"
          class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer border border-slate-700 rounded-lg"
        />
      </div>

      <!-- Predict Button -->
      <button 
        id="predictBtn" 
        onclick="runPrediction()" 
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition shadow text-center"
      >
        Predict
      </button>

      <!-- Response / Error / Output Container -->
      <div id="outputContainer" class="hidden rounded-lg p-4 bg-slate-900 border border-slate-700 space-y-2">
        <h3 id="outputStatus" class="font-semibold text-lg"></h3>
        <div id="outputContent" class="text-sm text-slate-300 overflow-x-auto"></div>
      </div>
    </section>

  </div>

  <script src="/static/script.js"></script>
</body>
</html>
